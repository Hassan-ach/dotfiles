# Prompt symbols
[character]
success_symbol = "[❯](bold #80d4d8)"  # Foam color
error_symbol = "[❯](bold #b5c7e9)"  # Love color

# Directory Path
[directory]
format            = "[$path](cyan) "
style = "bold #bec8c9"  # Text color
read_only = " "
read_only_style = "bold #80d4d8"  # Gold color
truncation_length = 4
truncate_to_repo  = true

# Git Branch
[git_branch]
symbol = " "
style = "bold #80d4d8"  # Iris color

# Git Status
[git_status]
style = "bold #80d4d8"  # Gold
conflicted = "⚔ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
modified = "*"
staged = "+"
deleted = "✘"
untracked = "?"

# Disable unused modules for minimalism
[package]
disabled = true

