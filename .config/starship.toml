# Prompt symbols
[character]
success_symbol = "[❯](bold #81d3e0)"  # Foam color
error_symbol = "[❯](bold #bac6ea)"  # Love color

# Directory Path
[directory]
format            = "[$path](cyan) "
style = "bold #bfc8ca"  # Text color
read_only = " "
read_only_style = "bold #81d3e0"  # Gold color
truncation_length = 4
truncate_to_repo  = true

# Git Branch
[git_branch]
symbol = " "
style = "bold #81d3e0"  # Iris color

# Git Status
[git_status]
style = "bold #81d3e0"  # Gold
conflicted = "⚔ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
modified = "*"
staged = "+"
deleted = "✘"
untracked = "?"

# Disable unused modules for minimalism
[package]
disabled = true

