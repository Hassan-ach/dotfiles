# Prompt symbols
[character]
success_symbol = "[❯](bold #a3d398)"  # Foam color
error_symbol = "[❯](bold #a0cfd3)"  # Love color

# Directory Path
[directory]
style = "bold #c2c8bc"  # Text color
read_only = " "
read_only_style = "bold #a3d398"  # Gold color

# Git Branch
[git_branch]
symbol = " "
style = "bold #a3d398"  # Iris color

# Git Status
[git_status]
style = "bold #a3d398"  # Gold
conflicted = "⚔ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
modified = "*"
staged = "+"
deleted = "✘"
untracked = "?"

# Disable unused modules for minimalism
[package]
disabled = true
