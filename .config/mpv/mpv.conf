# === HARDWARE & PERFORMANCE ===
hwdec=vulkan
gpu-api=vulkan
vo=gpu-next
profile=gpu-hq

# === SMOOTH REFRESH RATE SYNC ===
video-sync=audio
interpolation=no

# === NETWORK CACHE (STABLE FOR WI-FI) ===
cache=yes
demuxer-max-bytes=100M
cache-secs=30
network-timeout=30

# === AUDIO & BEHAVIOR ===
save-position-on-quit
keep-open=yes
volume=70
volume-max=150
