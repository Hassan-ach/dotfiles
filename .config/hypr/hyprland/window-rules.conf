# ================================
# SYSTEM BEHAVIOR
# ================================

# Idle inhibition
windowrule = idle_inhibit focus, match:class ^(celluloid|mpv|vlc|[Ss]potify)$
windowrule = idle_inhibit fullscreen, match:class ^(LibreWolf|floorp|Brave|firefox|chromium|zen|vivaldi)$

# Tearing optimization
windowrule = immediate on, match:title .*\.exe
windowrule = immediate on, match:title .*minecraft.*
windowrule = immediate on, match:class ^(steam_app)$

# Visual optimizations
windowrule = no_shadow on, match:float false
windowrule = center on, match:float true, match:xwayland false
windowrule = opaque on, match:class ^(foot|equibop|imv|swappy|brave-browser|mpv|vlc|celluloid)$

# Good practices
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false
windowrule = suppress_event maximize, match:class .*

# ================================
# PICTURE-IN-PICTURE
# ================================

windowrule {
     name = Picture-in-Picture
     match:title =  ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
     float = on
     keep_aspect_ratio = on
     move = 73 72
     size = (monitor_w*0.25) (monitor_h*0.25)
     pin = on
}

# ================================
# FILE DIALOGS
# ================================

$dialog_large = match:title ^(Open File|Select a File|Choose wallpaper|Open Folder|Save As|Library|File Upload|.*Save File.*|.*Save Folder.*|.*Save Image.*|.*Open As.*|.*Open Network Stream.*|.*Choose Files.*|.*Downloads -.*|File Operation Progress|Downloads.*|Choose Directory|Where do you want to save the.*)$

windowrule = float on, $dialog_large
windowrule = center on, $dialog_large
windowrule = size (monitor_w*0.55) (monitor_h*0.55), $dialog_large

$dialog_small = match:title ^(.*File Already Exists.*|.*Confirm to replace files.*|.*Confirm to delete files.*|Rename.*|Delete.*|Move to Trash.*|.*Confirmation.*|.*Warning.*|.*Error.*)$

windowrule = float on, $dialog_small
windowrule = center on, $dialog_small
windowrule = size (monitor_w*0.20) (monitor_h*0.15), $dialog_small

# ================================
# FLOATING WINDOW SIZE CATEGORIES
# ================================

windowrule {
  name = "Gnome Apps"
match:class = ^(org.gnome.*)$
  float = on
  size = (monitor_w*0.70) (monitor_h*0.70)
  center = on
}

windowrule {
  name = "Volume Control"
  match:class =  ^(center-float-large|qimgv|nvidia-settings|localsend|org.gnome.Evince)$
  float = on
  size = (monitor_w*0.70) (monitor_h*0.70)
  center = on
}

windowrule {
  name = "Medium Floating Windows"
  match:class  = ^(center-float|xdg-desktop-portal-gtk|selectdefaultapplication)$
  float = on
  size = (monitor_w*0.50) (monitor_h*0.50)
  center = on
}

windowrule {
  name = "Small Floating Windows"
  match:class = ^(center-float-mini|galculator|ytdlp-gui|udiskie|org.gnome.Calculator)$
  float = on
  size = (monitor_w*0.30) (monitor_h*0.40)
  center = on
}

# ================================
# MEDIA PLAYERS
# ================================

windowrule = float on, match:class ^(vlc)$
windowrule = size (monitor_w*0.50) (monitor_h*0.50), match:class ^(vlc)$, match:title ^(Select one or more files to open|Simple Preferences|Adjustments and Effects|Current Media Information|Open URL|Open Media|Save playlist as\.\.\.|Open Directory) — VLC media player$
windowrule = size (monitor_w*0.7) (monitor_h*0.7), match:class ^(vlc)$, match:title ^(.*VLC media player)$

windowrule {
  name = "Media Players"
  match:class = ^(mpv|celluloid|com.github.rafostar.Clapper)$
  float = on
  size = (monitor_w*0.7) (monitor_h*0.7)
  center = on
}

windowrule = opacity 1.0 override, match:title .*(YouTube).*

# ================================
# AUTHENTICATION & SECURITY
# ================================

windowrule {
  name = "Polkit Authentication Agents"
  match:class = ^(polkit-gnome-authentication-agent-1|polkit-kde-authentication-agent-1|hyprpolkitagent)$
  float = on
  pin = on
  stay_focused = on
}

windowrule = no_screen_share on, match:class ^(discord|vesktop|org.telegram.desktop|Signal|WhatsApp|Bitwarden)$

windowrule {
    name = "Bitwarden"
  match:class = ^(Bitwarden)$
  float = on
  size = (monitor_w*0.60) (monitor_h*0.60)
  center = on
  no_screen_share = on
}

# ================================
# APPLICATION-SPECIFIC RULES
# ================================

windowrule {
    name = "Audio Managers"
  match:class = ^(pavucontrol|blueman-manager|pwvucontrol)$
  float = on
  center = on
  size = (monitor_w*0.40) (monitor_h*0.40)
}

windowrule {
    name = "Nautilus Initial Load"
  match:class = ^(org.gnome.Nautilus)$
  match:initial_title = ^(Loading…|Home)$
  float = on
  size = (monitor_w*0.80) (monitor_h*0.80)
  center = on
}

windowrule {
    name = "XWayland Video Bridge"
  match:class = ^(xwaylandvideobridge)$
  opacity = 0.0 override 0.0 override
  no_anim = on
  no_blur = on
  no_initial_focus = on
  max_size = 1 1
}

windowrule {
  name = "Clipse GUI"
  match:class = ^(clipse-gui)$
  float = on
  size = (monitor_w*0.35) (monitor_h*0.45)
  center = on
  stay_focused = on
}

# ================================
# LAYER RULES
# ================================

layerrule = animation popin, match:namespace rofi
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.57, match:namespace rofi

layerrule = blur on, match:namespace quickshell.*
layerrule = ignore_alpha 0.65, match:namespace quickshell.*
layerrule = blur_popups on, match:namespace quickshell.*

# ================================
# WORKSPACE RULES
# ================================

workspace = w[tv1], gapsout:0, gapsin:0
windowrule = border_size 2, match:float false, match:workspace w[tv1]
